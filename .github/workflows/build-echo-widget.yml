name: Build Echo Owl widget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/build-echo-widget.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build permission-free widget APK
        working-directory: android-widget
        run: gradle --no-daemon :app:assembleDebug
      - name: Record APK checksum
        working-directory: android-widget
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: echo-owl-widget
          path: |
            android-widget/app/build/outputs/apk/debug/app-debug.apk
            android-widget/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish installable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create echo-widget-v1.0.0
          android-widget/app/build/outputs/apk/debug/app-debug.apk
          android-widget/app/build/outputs/apk/debug/app-debug.apk.sha256
          --prerelease
          --title "Echo Owl home-screen widget v1.0.0"
          --notes "Home-screen-only Echo owl widget. No runtime permissions, overlay, accessibility service, screen capture, microphone, camera, location, storage, or background service."
