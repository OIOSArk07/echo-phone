<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151922">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./echo-icon.svg" type="image/svg+xml">
    <title>Echo Remote</title>
    <script type="module" crossorigin src="./index-C0g4Ir6p.js"></script>
    <link rel="stylesheet" crossorigin href="./index-BJVOYUEk.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">PRIVATE PC ASSISTANT</p>
          <h1>Echo</h1>
        </div>
        <span id="status" class="status">Not paired</span>
      </header>

      <section id="pair-panel" class="panel hidden">
        <h2>Pair this phone</h2>
        <p>Scan the QR code shown by your PC. The pairing secret is imported on this phone and removed from the address bar.</p>
      </section>

      <section id="login-panel" class="panel hidden">
        <h2>Sign in</h2>
        <p>Use the same Supabase account configured on the PC bridge.</p>
        <form id="login-form">
          <label>Email<input id="email" type="email" autocomplete="username" required></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
        </form>
        <p id="login-error" class="error"></p>
      </section>

      <section id="chat-panel" class="chat hidden">
        <div class="conversation-bar">
          <label for="conversation-select">Conversation</label>
          <select id="conversation-select" aria-label="Conversation"></select>
          <button id="new-conversation" type="button">＋ New</button>
        </div>
        <div id="messages" class="messages" aria-live="polite">
        </div>
        <form id="chat-form" class="composer">
          <textarea id="prompt" rows="2" maxlength="32000" placeholder="Message Echo…" required></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <button id="sign-out" class="link-button" type="button">Sign out</button>
      </section>
    </main>
  </body>
</html>
